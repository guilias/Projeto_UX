<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpoint — Configurações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
<a href="index.html" class="brand"><img src="assets/checkpoint_icon.png" alt="Logo" style="width: 24px; height: 24px; object-fit: contain;"> checkpoint</a>    <div class="search-bar">
  </header>
  <div class="app-container" style="display: block; max-width: 800px; padding: 40px 20px;">
    <a href="index.html" class="link-more" style="margin-bottom: 20px;">← Voltar ao Início</a>
    <div class="widget-card" style="padding: 30px;">
      <h1 class="page-title" style="margin-bottom: 14px;">Configurações</h1>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">Gerencie suas preferências de conta, tema e notificações do Checkpoint.</p>
      
      <!-- Opções de Configuração -->
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
          <div>
            <strong>Modo Escuro</strong>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Ativado por padrão no sistema</p>
          </div>
          <button class="pill-btn active">Ligado</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
          <div>
            <strong>Notificações por Email</strong>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Receber avisos de novos seguidores e comentários</p>
          </div>
          <button class="pill-btn">Ativar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
